  // ─── HELPERS ───────────────────────────────────────────────────────────────

  function calcPts(pred, actual) {
    if (!pred || pred.home === "" || pred.home === undefined) return null;
    if (!actual || actual.home === "" || actual.home === undefined) return null;
    const ph = parseInt(pred.home), pa = parseInt(pred.away);
    const ah = parseInt(actual.home), aa = parseInt(actual.away);
    if (isNaN(ph)||isNaN(pa)||isNaN(ah)||isNaN(aa)) return null;
    if (ph===ah && pa===aa) return SCORING.exact;
    if (Math.sign(ph-pa) === Math.sign(ah-aa)) return SCORING.result;
    return 0;
  }

  function lsGet(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) { console.error(e); }
  }

  function uniqueDates(fixtures) {
    const seen = new Set();
    return fixtures
      .filter(f => { if(seen.has(f.date)) return false; seen.add(f.date); return true; })
      .map(f => ({ date: f.date, label: f.label }));
  }

    lsSet(LS.preds, preds);
    setState({ preds });
    showSaved();
  }

  function setActual(fid, side, val) {

    lsSet(LS.actuals, actuals);

  }

    lsSet(LS.konames, koNames);
    setState({ koNames });
    showSaved();
  }

  function resolveName(fid, side, fallback) {
    return state.koNames[fid]?.[side] || fallback;
  }

  function predCount(pid) {
    return ALL_FIXTURES.filter(f => {
      const p = state.preds[pid]?.[f.id];
      return p && p.home !== "" && p.home !== undefined && p.away !== "" && p.away !== undefined;
    }).length;
  }

  function getBoard() {
    return PLAYERS.map(p => {
      let total=0, exact=0, correct=0, wrong=0, scored=0;
      ALL_FIXTURES.forEach(f => {
        const pts = calcPts(state.preds[p.id]?.[f.id], state.actuals[f.id]);
        if (pts===null) return;
        scored++; total+=pts;
        if (pts===SCORING.exact) exact++;
        else if (pts===SCORING.result) correct++;
        else wrong++;
      });
      return { ...p, total, exact, correct, wrong, scored };
    }).sort((a,b) => b.total-a.total || a.name.localeCompare(b.name));
  }

  // ─── DOM HELPERS ───────────────────────────────────────────────────────────

  function el(tag, attrs, ...children) {
    const e = document.createElement(tag);
    if (attrs) {
      Object.entries(attrs).forEach(([k, v]) => {
        if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
        else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'class') e.className = v;
        else e.setAttribute(k, v);
      });
    }
    children.flat().forEach(c => {
      if (c === null || c === undefined) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }

  function s(styles) { return styles; }

  // ─── COMPONENTS ────────────────────────────────────────────────────────────

  function makeHeader() {
    return el('div', { style: s({ background:'linear-gradient(90deg,#7a0020 0%,#c8102e 50%,#7a0020 100%)', padding:'16px 16px 13px', textAlign:'center', boxShadow:'0 4px 24px rgba(200,16,46,0.3)', position:'relative', overflow:'hidden' }) },
      el('div', { style: s({ position:'absolute', inset:'0', opacity:'0.05', backgroundImage:'repeating-linear-gradient(45deg,#fff 0,#fff 1px,transparent 1px,transparent 8px)', pointerEvents:'none' }) }),
      el('div', { style: s({ fontSize:'28px' }) }, '⚽'),
      el('div', { style: s({ fontSize:'24px', fontWeight:'900', letterSpacing:'3px', textTransform:'uppercase' }) }, 'World Cup 2026'),
      el('div', { style: s({ fontSize:'10px', letterSpacing:'4px', color:'rgba(255,255,255,0.6)', textTransform:'uppercase', marginTop:'2px' }) }, 'Score Predictor')
    );
  }

  function makeNav() {
    const tabs = [
      { id:'scoreboard',  label:'🏆 Standings'  },
      { id:'predictions', label:'✏️ Predictions' },
      { id:'results',     label:'📝 Results'     },
    ];
    return el('div', { style: s({ display:'flex', background:'#090f1b', borderBottom:'2px solid #141f30' }) },
      ...tabs.map(t => el('button', {
        style: s({ flex:'1', padding:'12px 6px', background:'none', border:'none', cursor:'pointer',
          borderBottom: state.view===t.id ? '3px solid #e2b714' : '3px solid transparent',
          color: state.view===t.id ? '#e2b714' : '#3a5a70',
          fontSize:'13px', fontWeight:'700', letterSpacing:'1px', textTransform:'uppercase' }),
        onClick: () => setState({ view: t.id })
      }, t.label))
    );
  }

  function makeStageToggle() {
    return el('div', { style: s({ display:'flex', gap:'6px', marginBottom:'12px' }) },
      ...[ {id:'group',label:'⚽ Group Stage'}, {id:'knockout',label:'🏆 Knockout'} ].map(s2 =>
        el('button', {
          style: s({ flex:'1', padding:'8px', borderRadius:'8px', cursor:'pointer',
            background: state.stage===s2.id ? 'rgba(200,16,46,0.2)' : 'rgba(255,255,255,0.03)',
            border: state.stage===s2.id ? '1px solid #c8102e' : '1px solid rgba(255,255,255,0.1)',
            color: state.stage===s2.id ? '#fff' : '#5a7a90',
            fontWeight:'700', fontSize:'13px', letterSpacing:'1px' }),
          onClick: () => {
            const dates = s2.id==='group' ? GROUP_DATES : KNOCKOUT_DATES;
            setState({ stage: s2.id, activeDate: dates[0]?.date });
          }
        }, s2.label)
      )
    );
  }

  function makeDateTabs() {
    const dates = state.stage==='group' ? GROUP_DATES : KNOCKOUT_DATES;
    const wrap = el('div', { style: s({ overflowX:'auto', marginBottom:'14px', paddingBottom:'4px' }) });
    const row  = el('div', { style: s({ display:'flex', gap:'5px', minWidth:'max-content' }) });
    dates.forEach(d => {
      row.appendChild(el('button', {
        style: s({ padding:'6px 12px', borderRadius:'7px', cursor:'pointer', whiteSpace:'nowrap',
          border: state.activeDate===d.date ? '1px solid #e2b714' : '1px solid rgba(255,255,255,0.1)',
          background: state.activeDate===d.date ? 'rgba(226,183,20,0.12)' : 'rgba(255,255,255,0.03)',
          color: state.activeDate===d.date ? '#e2b714' : '#5a7a90',
          fontWeight:'700', fontSize:'12px', letterSpacing:'1px' }),
        onClick: () => setState({ activeDate: d.date })
      }, d.label));
    });
    wrap.appendChild(row);
    return wrap;
  }

  function makeFixtureCard(fixture, mode) {
    const isKO   = !!fixture.round;
    const dh     = isKO ? resolveName(fixture.id,'home',fixture.home) : fixture.home;
    const da     = isKO ? resolveName(fixture.id,'away',fixture.away) : fixture.away;
    const pred   = state.preds[state.activePlayer]?.[fixture.id] || {};
    const actual = state.actuals[fixture.id] || {};
    const pts    = mode==='predict' ? calcPts(pred, actual) : null;
    const hasActual = actual.home !== undefined && actual.home !== '';

    const card = el('div', { style: s({
      background:'rgba(255,255,255,0.03)',
      border: `1px solid ${hasActual&&mode==='results' ? 'rgba(46,204,113,0.2)' : 'rgba(255,255,255,0.07)'}`,
      borderRadius:'10px', padding:'10px 12px', marginBottom:'8px'
    }) });

    // Labels row
    const labelRow = el('div', { style: s({ display:'flex', alignItems:'center', gap:'6px', marginBottom:'6px', flexWrap:'wrap' }) });
    labelRow.appendChild(el('span', { style: s({ fontSize:'10px', background:'rgba(200,16,46,0.2)', border:'1px solid rgba(200,16,46,0.25)', color:'#ff6b7a', borderRadius:'4px', padding:'2px 6px', letterSpacing:'1px' }) }, fixture.label));
    if (fixture.group) labelRow.appendChild(el('span', { style: s({ fontSize:'10px', color:'#3a5a70' }) }, `Group ${fixture.group}`));
    if (fixture.round) labelRow.appendChild(el('span', { style: s({ fontSize:'10px', color:'#9b7fd4', background:'rgba(120,90,170,0.15)', border:'1px solid rgba(120,90,170,0.3)', borderRadius:'4px', padding:'2px 6px' }) }, fixture.round));
    if (mode==='results' && hasActual) labelRow.appendChild(el('span', { style: s({ marginLeft:'auto', fontSize:'10px', color:'#2ecc71' }) }, '✓'));
    if (mode==='predict' && hasActual && pts!==null) {
      const icon = pts===SCORING.exact?'🎯':pts===SCORING.result?'✅':'❌';
      labelRow.appendChild(el('span', { style: s({ marginLeft:'auto', fontSize:'12px', fontWeight:'900', color: pts===SCORING.exact?'#e2b714':pts===SCORING.result?'#2ecc71':'#ff6b7a' }) }, `${icon} ${pts}pts`));
    }
    card.appendChild(labelRow);

    // Knockout name editors
    if (mode==='results' && isKO) {
      const row = el('div', { style: s({ display:'flex', gap:'6px', marginBottom:'8px' }) });
      ['home','away'].forEach(side => {
        const inp = el('input', {
          style: s({ flex:'1', background:'rgba(120,90,170,0.1)', border:'1px solid rgba(120,90,170,0.3)', borderRadius:'6px', color:'#c8b8f0', padding:'5px 8px', fontSize:'11px', outline:'none' }),
          placeholder: fixture[side],
          value: state.koNames[fixture.id]?.[side] || '',
          onInput: e => setKoName(fixture.id, side, e.target.value)
        });
        row.appendChild(inp);
      });
      card.appendChild(row);
    }

    // Score row
    const scoreRow = el('div', { style: s({ display:'flex', alignItems:'center', gap:'4px' }) });
    scoreRow.appendChild(el('div', { style: s({ flex:'1', textAlign:'right', fontSize:'13px', fontWeight:'700', lineHeight:'1.3' }) }, `${FLAGS[dh]||'🏳️'} ${dh}`));

    const scoreInner = el('div', { style: s({ display:'flex', alignItems:'center', gap:'4px', padding:'0 8px', flexShrink:'0' }) });
    if (mode==='predict') {
      const makeBox = (side) => {
        const inp = document.createElement('input');
        inp.type = 'number'; inp.min='0'; inp.max='20';
        inp.value = pred[side] !== undefined ? pred[side] : '';
        Object.assign(inp.style, { width:'38px', textAlign:'center', fontSize:'18px', fontWeight:'900', border:'none', borderBottom:'2px solid #e2b714', background:'transparent', color:'#fff', outline:'none', padding:'2px 0', fontFamily:"'Barlow Condensed',sans-serif" });
        inp.addEventListener('input', e => {
          const v = e.target.value === '' ? '' : Math.max(0, parseInt(e.target.value)||0);
          setPred(state.activePlayer, fixture.id, side, v);
        });
        return inp;
      };
      scoreInner.appendChild(makeBox('home'));
      scoreInner.appendChild(el('span', { style: s({ color:'#3a5a70', fontWeight:'900' }) }, '-'));
      scoreInner.appendChild(makeBox('away'));
    } else {
      const makeBox = (side) => {
        const inp = document.createElement('input');
        inp.type = 'number'; inp.min='0'; inp.max='20';
        inp.value = actual[side] !== undefined ? actual[side] : '';
        Object.assign(inp.style, { width:'38px', textAlign:'center', fontSize:'18px', fontWeight:'900', border:'none', borderBottom:'2px solid #e2b714', background:'transparent', color:'#fff', outline:'none', padding:'2px 0', fontFamily:"'Barlow Condensed',sans-serif" });
        inp.addEventListener('input', e => {
          const v = e.target.value==='' ? '' : Math.max(0, parseInt(e.target.value)||0);
          setActual(fixture.id, side, v);
        });
        return inp;
      };
      scoreInner.appendChild(makeBox('home'));
      scoreInner.appendChild(el('span', { style: s({ color:'#3a5a70', fontWeight:'900' }) }, '-'));
      scoreInner.appendChild(makeBox('away'));
    }
    scoreRow.appendChild(scoreInner);
    scoreRow.appendChild(el('div', { style: s({ flex:'1', fontSize:'13px', fontWeight:'700', lineHeight:'1.3' }) }, `${FLAGS[da]||'🏳️'} ${da}`));
    card.appendChild(scoreRow);

    if (mode==='predict' && hasActual) {
      card.appendChild(el('div', { style: s({ textAlign:'center', fontSize:'10px', color:'#2ecc71', marginTop:'5px' }) }, `Actual: ${actual.home}–${actual.away}`));
    }

    if (mode==='results' && hasActual) {
      const row = el('div', { style: s({ marginTop:'8px', display:'flex', gap:'5px', flexWrap:'wrap' }) });
      PLAYERS.forEach(p => {
        const pr  = state.preds[p.id]?.[fixture.id];
        const pts = calcPts(pr, actual);
        const has = pr && pr.home !== undefined && pr.home !== '';
        row.appendChild(el('span', { style: s({ fontSize:'10px', padding:'2px 7px', borderRadius:'8px', fontWeight:'700', background:'rgba(255,255,255,0.04)', color: pts===SCORING.exact?'#e2b714':pts===SCORING.result?'#2ecc71':pts===0?'#ff6b7a':'#3a5a70' }) },
          `${p.name}: ${has ? `${pr.home}-${pr.away} (${pts}pts)` : '—'}`
        ));
      });
      card.appendChild(row);
    }

    return card;
  }

  // ─── VIEWS ─────────────────────────────────────────────────────────────────

  function makeScoreboard() {
    const board = getBoard();
    const topScore = board[0]?.total ?? 0;
    const medals = ['#ffd700','#c0c0c0','#cd7f32'];
    const completedResults = ALL_FIXTURES.filter(f => { const a=state.actuals[f.id]; return a&&a.home!==undefined&&a.home!==''; }).length;

    const wrap = el('div', { style: s({ padding:'14px 14px 0' }) });

    const hdr = el('div', { style: s({ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'4px' }) });
    hdr.appendChild(el('div', { style: s({ fontSize:'17px', fontWeight:'900', letterSpacing:'3px', color:'#e2b714', textTransform:'uppercase' }) }, '🏆 Standings'));
    hdr.appendChild(el('div', { style: s({ fontSize:'11px', color:'#5a7a90' }) }, `${completedResults}/${ALL_FIXTURES.length} results in`));
    wrap.appendChild(hdr);
    wrap.appendChild(el('div', { style: s({ fontSize:'11px', color:'#3a5a70', marginBottom:'14px' }) }, `🎯 Exact score = ${SCORING.exact}pts · ✅ Correct result = ${SCORING.result}pts`));

    board.forEach((p, i) => {
      const medal = medals[i];
      const pct   = topScore > 0 ? Math.round(p.total/topScore*100) : 0;
      const card  = el('div', { style: s({
        background: i===0&&p.total>0 ? 'rgba(226,183,20,0.07)' : 'rgba(255,255,255,0.03)',
        border: `1px solid ${medal ? medal+'28' : 'rgba(255,255,255,0.07)'}`,
        borderRadius:'11px', padding:'12px 14px', marginBottom:'8px',
        display:'flex', alignItems:'center', gap:'12px'
      }) });

      card.appendChild(el('div', { style: s({ width:'32px', height:'32px', borderRadius:'50%', flexShrink:'0', background: medal?medal+'1a':'#111d2a', border:`2px solid ${medal||'#1e2d3d'}`, display:'flex', alignItems:'center', justifyContent:'center', fontWeight:'900', fontSize:'14px', color:medal||'#3a5a70' }) }, `${i+1}`));

      const info = el('div', { style: s({ flex:'1', minWidth:'0' }) });
      info.appendChild(el('div', { style: s({ fontWeight:'800', fontSize:'17px' }) }, p.name));
      info.appendChild(el('div', { style: s({ fontSize:'10px', color:'#3a5a70', marginTop:'2px' }) }, `🎯${p.exact} exact · ✅${p.correct} result · ❌${p.wrong} wrong · ${p.scored} scored · ${predCount(p.id)}/${ALL_FIXTURES.length} predicted`));
      const barWrap = el('div', { style: s({ marginTop:'6px', height:'3px', background:'#0f1a26', borderRadius:'2px', overflow:'hidden' }) });
      barWrap.appendChild(el('div', { style: s({ height:'100%', width:`${pct}%`, background: medal?`linear-gradient(90deg,${medal},${medal}88)`:'linear-gradient(90deg,#c8102e,#e2b714)', borderRadius:'2px', transition:'width 0.5s' }) }));
      info.appendChild(barWrap);
      card.appendChild(info);

      const scoreDiv = el('div', { style: s({ textAlign:'right', flexShrink:'0' }) });
      scoreDiv.appendChild(el('div', { style: s({ fontSize:'34px', fontWeight:'900', color:medal||'#c8d8e8', lineHeight:'1' }) }, `${p.total}`));
      scoreDiv.appendChild(el('div', { style: s({ fontSize:'9px', color:'#3a5a70', letterSpacing:'2px' }) }, 'PTS'));
      card.appendChild(scoreDiv);
      wrap.appendChild(card);
    });

    // Match detail
    const played = ALL_FIXTURES.filter(f => { const a=state.actuals[f.id]; return a&&a.home!==undefined&&a.home!==''; });
    if (played.length > 0) {
      wrap.appendChild(el('div', { style: s({ fontSize:'13px', fontWeight:'800', letterSpacing:'2px', color:'#e2b714', textTransform:'uppercase', margin:'20px 0 10px', borderLeft:'3px solid #c8102e', paddingLeft:'10px' }) }, 'Match Detail'));
      played.forEach(f => {
        const a  = state.actuals[f.id];
        const dh = f.round ? resolveName(f.id,'home',f.home) : f.home;
        const da = f.round ? resolveName(f.id,'away',f.away) : f.away;
        const mCard = el('div', { style: s({ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:'8px', padding:'9px 12px', marginBottom:'6px' }) });
        mCard.appendChild(el('div', { style: s({ fontSize:'12px', fontWeight:'700', marginBottom:'5px' }) },
          el('span', { style: s({ color:'#3a5a70', fontSize:'10px', marginRight:'8px' }) }, `${f.label} ${f.group?'Grp '+f.group:f.round}`),
          `${FLAGS[dh]||'🏳️'} ${dh} `,
          el('span', { style: s({ color:'#2ecc71', fontWeight:'900' }) }, `${a.home}–${a.away}`),
          ` ${da} ${FLAGS[da]||'🏳️'}`
        ));
        const predsRow = el('div', { style: s({ display:'flex', gap:'5px', flexWrap:'wrap' }) });
        PLAYERS.forEach(p => {
          const pr  = state.preds[p.id]?.[f.id];
          const pts = calcPts(pr, a);
          const has = pr && pr.home !== undefined && pr.home !== '';
          predsRow.appendChild(el('span', { style: s({ fontSize:'11px', padding:'3px 8px', borderRadius:'9px', fontWeight:'700', background:'rgba(255,255,255,0.04)', color: pts===SCORING.exact?'#e2b714':pts===SCORING.result?'#2ecc71':pts===0?'#ff6b7a':'#3a5a70' }) },
            `${p.name}: ${has?`${pr.home}-${pr.away} (+${pts})`:'—'}`
          ));
        });
        mCard.appendChild(predsRow);
        wrap.appendChild(mCard);
      });
    }

    wrap.appendChild(el('div', { style: s({ height:'24px' }) }));
    return wrap;
  }

  function makePredictions() {
    const wrap = el('div', { style: s({ padding:'14px 14px 0' }) });

    // Player chips
    const chips = el('div', { style: s({ display:'flex', flexWrap:'wrap', gap:'6px', marginBottom:'14px' }) });
    PLAYERS.forEach(p => {
      chips.appendChild(el('button', {
        style: s({ padding:'7px 13px', borderRadius:'16px', cursor:'pointer',
          background: state.activePlayer===p.id ? 'rgba(226,183,20,0.15)' : 'rgba(255,255,255,0.04)',
          border: state.activePlayer===p.id ? '1px solid #e2b714' : '1px solid rgba(255,255,255,0.1)',
          color: state.activePlayer===p.id ? '#e2b714' : '#c0cfe0',
          fontWeight:'700', fontSize:'13px' }),
        onClick: () => setState({ activePlayer: p.id })
      }, `${p.name} `, el('span', { style: s({ fontSize:'10px', opacity:'0.55' }) }, `${predCount(p.id)}/${ALL_FIXTURES.length}`)));
    });
    wrap.appendChild(chips);

    const activeName = PLAYERS.find(p=>p.id===state.activePlayer)?.name;
    wrap.appendChild(el('div', { style: s({ fontSize:'12px', color:'#2ecc71', marginBottom:'12px' }) }, '✏️ ', el('strong', { style: s({ color:'#fff' }) }, activeName)));

    wrap.appendChild(makeStageToggle());
    wrap.appendChild(makeDateTabs());

    const fixtures = (state.stage==='group' ? GROUP_FIXTURES : KNOCKOUT_FIXTURES).filter(f=>f.date===state.activeDate);
    if (fixtures.length===0) {
      wrap.appendChild(el('div', { style: s({ color:'#3a5a70', textAlign:'center', padding:'30px', fontSize:'13px' }) }, 'No fixtures on this date.'));
    } else {
      fixtures.forEach(f => wrap.appendChild(makeFixtureCard(f, 'predict')));
    }
    return wrap;
  }

  function makeResults() {
    const completedResults = ALL_FIXTURES.filter(f => { const a=state.actuals[f.id]; return a&&a.home!==undefined&&a.home!==''; }).length;
    const wrap = el('div', { style: s({ padding:'14px 14px 0' }) });

    const hdr = el('div', { style: s({ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px' }) });
    hdr.appendChild(el('div', { style: s({ fontSize:'17px', fontWeight:'900', letterSpacing:'2px', color:'#e2b714', textTransform:'uppercase' }) }, '📝 Enter Results'));
    wrap.appendChild(hdr);



    if (state.stage==='knockout') {
      wrap.appendChild(el('div', { style: s({ background:'rgba(120,90,170,0.08)', border:'1px solid rgba(120,90,170,0.25)', borderRadius:'9px', padding:'9px 13px', marginBottom:'12px', fontSize:'12px', color:'#c8b8f0' }) },
        '💡 Type team names into the purple fields as teams qualify.'));
    }

    wrap.appendChild(el('div', { style: s({ fontSize:'11px', color:'#5a7a90', marginBottom:'12px' }) }, `${completedResults}/${ALL_FIXTURES.length} results entered`));
    wrap.appendChild(makeStageToggle());
    wrap.appendChild(makeDateTabs());

    const fixtures = (state.stage==='group' ? GROUP_FIXTURES : KNOCKOUT_FIXTURES).filter(f=>f.date===state.activeDate);
    if (fixtures.length===0) {
      wrap.appendChild(el('div', { style: s({ color:'#3a5a70', textAlign:'center', padding:'30px', fontSize:'13px' }) }, 'No fixtures on this date.'));
    } else {
      fixtures.forEach(f => wrap.appendChild(makeFixtureCard(f, 'results')));
    }
    return wrap;
  }

  function tryUnlock() {
    if (state.pinInput === state.adminPin) setState({ unlocked: true, pinInput: '' });
    else setState({ pinInput: '' });
  }

  // ─── RENDER ────────────────────────────────────────────────────────────────

  function render() {
    const root = document.getElementById('root');
    root.innerHTML = '';

    root.appendChild(makeHeader());
    root.appendChild(makeNav());

    if (state.view==='scoreboard')  root.appendChild(makeScoreboard());
    if (state.view==='predictions') root.appendChild(makePredictions());
    if (state.view==='results')     root.appendChild(makeResults());

    if (state.flashSaved) {
      root.appendChild(el('div', { style: s({ position:'fixed', bottom:'16px', right:'16px', zIndex:'9999', background:'#0a2a18', border:'1px solid #2a7a4a', color:'#2ecc71', borderRadius:'20px', padding:'6px 16px', fontSize:'12px', fontWeight:'700', letterSpacing:'1px', boxShadow:'0 4px 16px rgba(0,0,0,0.5)' }) }, '✓ Saved'));
    }
  }

  render();
  </script>
</body>
</html>
